<header class="site-header" role="banner">
  <div class="site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand__mark" aria-hidden="true">🐦</span>
      <span>Hummingbird Tutorial</span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <a href="{{ '/docs/00-outline/' | relative_url }}"
         {% if page.url contains '/docs/' %}aria-current="page"{% endif %}>Chapters</a>
      <a href="{{ '/examples/' | relative_url }}"
         {% if page.url contains '/examples/' %}aria-current="page"{% endif %}>Examples</a>
      <a href="{{ '/bibliography/' | relative_url }}"
         {% if page.url contains '/bibliography/' %}aria-current="page"{% endif %}>Bibliography</a>
      <a href="https://github.com/{{ site.github_username | default: 'YOURUSER' }}/hummingbird-tutorial"
         rel="noopener">GitHub ↗</a>
    </nav>
  </div>
</header>

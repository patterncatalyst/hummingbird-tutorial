<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="100%" style="max-width:820px;height:auto;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cc0000"/>
    </marker>
    <style><![CDATA[
      text { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #1a1a1a; }
      .title { font-size: 18px; font-weight: 600; }
      .label { font-size: 14px; }
      .small { font-size: 12px; fill: #666; }
      .accent { fill: #cc0000; }
      .box { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.5; }
      .box-accent { fill: #fff5f5; stroke: #cc0000; stroke-width: 1.5; }
      .box-muted { fill: #f7f7f7; stroke: #999999; stroke-width: 1; }
      .conn { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
      .conn-red { stroke: #cc0000; stroke-width: 1.5; fill: none; }
      .dashed { stroke-dasharray: 4 3; }
    ]]></style>
  </defs>
  <text x="410.0" y="32" class="title" text-anchor="middle">Four debugging layers, cheap to invasive</text>
  <rect x="80" y="70" width="580" height="80" rx="6" class="box"/>
  <text x="370.0" y="106.0" text-anchor="middle" class="label">Layer 1 — podman commands</text>
  <text x="370.0" y="124.0" text-anchor="middle" class="small">inspect, logs, top, stats, events</text>
  <rect x="680" y="95" width="100" height="30" rx="4" class="box-muted"/>
  <text x="730" y="115" text-anchor="middle" class="small">cheapest</text>
  <rect x="80" y="165" width="580" height="80" rx="6" class="box"/>
  <text x="370.0" y="201.0" text-anchor="middle" class="label">Layer 2 — structured logs</text>
  <text x="370.0" y="219.0" text-anchor="middle" class="small">JSON to stdout, trace IDs, ready signals</text>
  <rect x="680" y="190" width="100" height="30" rx="4" class="box-muted"/>
  <text x="730" y="210" text-anchor="middle" class="small">cheap</text>
  <rect x="80" y="260" width="580" height="80" rx="6" class="box-accent"/>
  <text x="370.0" y="296.0" text-anchor="middle" class="label">Layer 3 — debug sidecar</text>
  <text x="370.0" y="314.0" text-anchor="middle" class="small">ubi9/toolbox + shared namespaces</text>
  <rect x="680" y="285" width="100" height="30" rx="4" class="box-muted"/>
  <text x="730" y="305" text-anchor="middle" class="small">moderate</text>
  <rect x="80" y="355" width="580" height="80" rx="6" class="box"/>
  <text x="370.0" y="391.0" text-anchor="middle" class="label">Layer 4 — kubectl debug</text>
  <text x="370.0" y="409.0" text-anchor="middle" class="small">cluster-side ephemeral debug pod</text>
  <rect x="680" y="380" width="100" height="30" rx="4" class="box-muted"/>
  <text x="730" y="400" text-anchor="middle" class="small">most invasive</text>
  <text x="410.0" y="460" class="small" text-anchor="middle">Use the cheapest layer that answers the question</text>
</svg>

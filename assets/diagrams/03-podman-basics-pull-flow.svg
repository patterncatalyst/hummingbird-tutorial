<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" role="img" aria-label="Sequence diagram showing how podman pull resolves a Hummingbird image: terminal requests manifest from registry, receives layer digests, fetches each layer, writes layer bytes to local containers-storage, and tags the image">
  <title>How podman pull resolves a Hummingbird image</title>
  <desc>Three vertical lifelines: terminal, registry, containers-storage. Five numbered messages flow between them in time order, top to bottom: 1) terminal requests manifest, 2) registry returns layer digests, 3) terminal fetches layers, 4) registry writes layer bytes to storage, 5) terminal tags image locally in storage.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cc0000"/>
    </marker>
    <style>
      text         { font-family: 'Red Hat Display', system-ui, sans-serif; fill: #1a1a1a; }
      .title       { font-size: 18px; font-weight: 700; }
      .label       { font-size: 14px; font-weight: 600; }
      .sub         { font-size: 12px; fill: #666666; }
      .step        { font-size: 12px; fill: #1a1a1a; }
      .step-red    { font-size: 12px; fill: #cc0000; font-weight: 600; }
      .box         { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.5; }
      .box-accent  { fill: #fff5f5; stroke: #cc0000; stroke-width: 1.5; }
      .lifeline    { stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .conn        { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
      .conn-red    { stroke: #cc0000; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
      .footer      { font-size: 12px; fill: #666666; font-style: italic; }
    </style>
  </defs>

  <!-- Title -->
  <text x="440" y="32" class="title" text-anchor="middle">How podman pull resolves a Hummingbird image</text>

  <!-- Lifeline boxes at top -->
  <rect x="50"  y="55" width="200" height="60" rx="6" class="box"/>
  <text x="150" y="83"  text-anchor="middle" class="label">podman pull</text>
  <text x="150" y="103" text-anchor="middle" class="sub">your terminal</text>

  <rect x="340" y="55" width="200" height="60" rx="6" class="box-accent"/>
  <text x="440" y="83"  text-anchor="middle" class="label">quay.io/hummingbird</text>
  <text x="440" y="103" text-anchor="middle" class="sub">registry</text>

  <rect x="630" y="55" width="200" height="60" rx="6" class="box"/>
  <text x="730" y="83"  text-anchor="middle" class="label">containers-storage</text>
  <text x="730" y="103" text-anchor="middle" class="sub">local on disk</text>

  <!-- Vertical lifelines drop from box bottoms to y=400 -->
  <line class="lifeline" x1="150" y1="115" x2="150" y2="400" />
  <line class="lifeline" x1="440" y1="115" x2="440" y2="400" />
  <line class="lifeline" x1="730" y1="115" x2="730" y2="400" />

  <!-- Step 1: terminal → registry, request manifest -->
  <line class="conn" x1="150" y1="160" x2="440" y2="160" marker-end="url(#arrow)"/>
  <text x="295" y="153" class="step" text-anchor="middle">1. request manifest</text>

  <!-- Step 2: registry → terminal, layer digests -->
  <line class="conn" x1="440" y1="200" x2="150" y2="200" marker-end="url(#arrow)"/>
  <text x="295" y="193" class="step" text-anchor="middle">2. manifest + layer digests</text>

  <!-- Step 3: terminal → registry, fetch each layer -->
  <line class="conn" x1="150" y1="245" x2="440" y2="245" marker-end="url(#arrow)"/>
  <text x="295" y="238" class="step" text-anchor="middle">3. fetch each layer</text>

  <!-- Step 4: registry → storage, write layer bytes -->
  <line class="conn" x1="440" y1="285" x2="730" y2="285" marker-end="url(#arrow)"/>
  <text x="585" y="278" class="step" text-anchor="middle">4. write layer bytes</text>

  <!-- Step 5: terminal → storage, tag locally (red dashed, spans full width) -->
  <line class="conn-red" x1="150" y1="335" x2="730" y2="335" marker-end="url(#arrow-red)"/>
  <text x="440" y="328" class="step-red" text-anchor="middle">5. tag image locally</text>

  <!-- Footer notes -->
  <text x="440" y="425" class="footer" text-anchor="middle">Step 3 repeats for each layer in the manifest; layers already in local storage are skipped.</text>
  <text x="440" y="445" class="footer" text-anchor="middle">Step 4 streams concurrently with step 3 — fetch and write happen as bytes arrive.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="100%" style="max-width:880px;height:auto;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cc0000"/>
    </marker>
    <style><![CDATA[
      text { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #1a1a1a; }
      .title { font-size: 18px; font-weight: 600; }
      .label { font-size: 14px; }
      .small { font-size: 12px; fill: #666; }
      .accent { fill: #cc0000; }
      .box { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.5; }
      .box-accent { fill: #fff5f5; stroke: #cc0000; stroke-width: 1.5; }
      .box-muted { fill: #f7f7f7; stroke: #999999; stroke-width: 1; }
      .conn { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
      .conn-red { stroke: #cc0000; stroke-width: 1.5; fill: none; }
      .dashed { stroke-dasharray: 4 3; }
    ]]></style>
  </defs>
  <text x="440.0" y="32" class="title" text-anchor="middle">How podman pull resolves a Hummingbird image</text>
  <rect x="50" y="70" width="200" height="70" rx="6" class="box"/>
  <text x="150.0" y="101.0" text-anchor="middle" class="label">podman pull</text>
  <text x="150.0" y="119.0" text-anchor="middle" class="small">your terminal</text>
  <rect x="340" y="70" width="200" height="70" rx="6" class="box-accent"/>
  <text x="440.0" y="101.0" text-anchor="middle" class="label">quay.io/hummingbird</text>
  <text x="440.0" y="119.0" text-anchor="middle" class="small">registry.access.redhat.com</text>
  <rect x="630" y="70" width="200" height="70" rx="6" class="box"/>
  <text x="730.0" y="101.0" text-anchor="middle" class="label">containers-storage</text>
  <text x="730.0" y="119.0" text-anchor="middle" class="small">local on disk / VM</text>
  <line x1="250" y1="95" x2="340" y2="95" class="conn" marker-end="url(#arrow)"/>
  <text x="295" y="88" class="small" text-anchor="middle">1. request</text>
  <text x="295" y="110" class="small" text-anchor="middle">manifest</text>
  <line x1="340" y1="125" x2="250" y2="125" class="conn" marker-end="url(#arrow)"/>
  <text x="295" y="140" class="small" text-anchor="middle">2. layer list +</text>
  <text x="295" y="155" class="small" text-anchor="middle">digests</text>
  <line x1="250" y1="175" x2="340" y2="175" class="conn" marker-end="url(#arrow)"/>
  <text x="295" y="170" class="small" text-anchor="middle">3. fetch</text>
  <text x="295" y="188" class="small" text-anchor="middle">each layer</text>
  <line x1="540" y1="175" x2="630" y2="175" class="conn" marker-end="url(#arrow)"/>
  <text x="585" y="170" class="small" text-anchor="middle">4. write</text>
  <text x="585" y="188" class="small" text-anchor="middle">to disk</text>
  <line x1="540" y1="225" x2="630" y2="225" class="conn-red" marker-end="url(#arrow-red)"/>
  <text x="585" y="240" class="small" text-anchor="middle">5. tag locally</text>
  <text x="440.0" y="320" class="small" text-anchor="middle">Steps 3 and 4 happen in parallel for each layer</text>
  <text x="440.0" y="345" class="small" text-anchor="middle">Layers already in local storage are skipped</text>
</svg>

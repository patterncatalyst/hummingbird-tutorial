<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" style="max-width:900px;height:auto;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cc0000"/>
    </marker>
    <style><![CDATA[
      text { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #1a1a1a; }
      .title { font-size: 18px; font-weight: 600; }
      .label { font-size: 14px; }
      .small { font-size: 12px; fill: #666; }
      .accent { fill: #cc0000; }
      .box { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.5; }
      .box-accent { fill: #fff5f5; stroke: #cc0000; stroke-width: 1.5; }
      .box-muted { fill: #f7f7f7; stroke: #999999; stroke-width: 1; }
      .conn { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
      .conn-red { stroke: #cc0000; stroke-width: 1.5; fill: none; }
      .dashed { stroke-dasharray: 4 3; }
    ]]></style>
  </defs>
  <text x="450.0" y="32" class="title" text-anchor="middle">Local toolchain and the registries it talks to</text>
  <rect x="40" y="60" width="500" height="380" rx="10" class="box-muted"/>
  <text x="60" y="84" class="small" text-anchor="start">Your machine (Fedora 43 or macOS)</text>
  <rect x="70" y="110" width="130" height="50" rx="6" class="box"/>
  <text x="135.0" y="131.0" text-anchor="middle" class="label">podman</text>
  <text x="135.0" y="149.0" text-anchor="middle" class="small">build / run / pull</text>
  <rect x="220" y="110" width="130" height="50" rx="6" class="box"/>
  <text x="285.0" y="131.0" text-anchor="middle" class="label">buildah</text>
  <text x="285.0" y="149.0" text-anchor="middle" class="small">build OCI images</text>
  <rect x="370" y="110" width="130" height="50" rx="6" class="box"/>
  <text x="435.0" y="131.0" text-anchor="middle" class="label">skopeo</text>
  <text x="435.0" y="149.0" text-anchor="middle" class="small">copy / inspect</text>
  <rect x="70" y="200" width="130" height="50" rx="6" class="box"/>
  <text x="135.0" y="221.0" text-anchor="middle" class="label">cosign</text>
  <text x="135.0" y="239.0" text-anchor="middle" class="small">sign / verify</text>
  <rect x="220" y="200" width="130" height="50" rx="6" class="box"/>
  <text x="285.0" y="221.0" text-anchor="middle" class="label">syft</text>
  <text x="285.0" y="239.0" text-anchor="middle" class="small">generate SBOMs</text>
  <rect x="370" y="200" width="130" height="50" rx="6" class="box"/>
  <text x="435.0" y="221.0" text-anchor="middle" class="label">grype</text>
  <text x="435.0" y="239.0" text-anchor="middle" class="small">scan for CVEs</text>
  <rect x="70" y="290" width="200" height="50" rx="6" class="box"/>
  <text x="170.0" y="311.0" text-anchor="middle" class="label">podman-compose</text>
  <text x="170.0" y="329.0" text-anchor="middle" class="small">multi-container</text>
  <rect x="290" y="290" width="210" height="50" rx="6" class="box"/>
  <text x="395.0" y="311.0" text-anchor="middle" class="label">Podman Desktop</text>
  <text x="395.0" y="329.0" text-anchor="middle" class="small">GUI for all of the above</text>
  <rect x="70" y="370" width="130" height="50" rx="6" class="box"/>
  <text x="135.0" y="391.0" text-anchor="middle" class="label">jq</text>
  <text x="135.0" y="409.0" text-anchor="middle" class="small">JSON in shell</text>
  <rect x="600" y="80" width="260" height="350" rx="10" class="box-muted"/>
  <text x="620" y="104" class="small" text-anchor="start">Registries</text>
  <rect x="620" y="130" width="220" height="70" rx="6" class="box"/>
  <text x="730.0" y="161.0" text-anchor="middle" class="label">registry.access.redhat.com</text>
  <text x="730.0" y="179.0" text-anchor="middle" class="small">UBI base + builder images</text>
  <rect x="620" y="220" width="220" height="70" rx="6" class="box-accent"/>
  <text x="730.0" y="251.0" text-anchor="middle" class="label">quay.io/hummingbird</text>
  <text x="730.0" y="269.0" text-anchor="middle" class="small">Hummingbird runtime images</text>
  <rect x="620" y="310" width="220" height="70" rx="6" class="box"/>
  <text x="730.0" y="341.0" text-anchor="middle" class="label">(your internal mirror)</text>
  <text x="730.0" y="359.0" text-anchor="middle" class="small">optional, for air-gapped use</text>
  <line x1="540" y1="135" x2="620" y2="165" class="conn" marker-end="url(#arrow)"/>
  <line x1="540" y1="225" x2="620" y2="255" class="conn-red" marker-end="url(#arrow-red)"/>
  <line x1="540" y1="315" x2="620" y2="345" class="conn dashed" marker-end="url(#arrow)"/>
</svg>

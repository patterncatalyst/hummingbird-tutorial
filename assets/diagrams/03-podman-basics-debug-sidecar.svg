<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="100%" style="max-width:800px;height:auto;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cc0000"/>
    </marker>
    <style><![CDATA[
      text { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #1a1a1a; }
      .title { font-size: 18px; font-weight: 600; }
      .label { font-size: 14px; }
      .small { font-size: 12px; fill: #666; }
      .accent { fill: #cc0000; }
      .box { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.5; }
      .box-accent { fill: #fff5f5; stroke: #cc0000; stroke-width: 1.5; }
      .box-muted { fill: #f7f7f7; stroke: #999999; stroke-width: 1; }
      .conn { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
      .conn-red { stroke: #cc0000; stroke-width: 1.5; fill: none; }
      .dashed { stroke-dasharray: 4 3; }
    ]]></style>
  </defs>
  <text x="400.0" y="32" class="title" text-anchor="middle">The debug-sidecar pattern</text>
  <rect x="60" y="80" width="280" height="280" rx="10" class="box-accent"/>
  <text x="200" y="105" class="label" text-anchor="middle">Hummingbird container</text>
  <text x="200" y="125" class="small" text-anchor="middle">(the one you are debugging)</text>
  <rect x="100" y="150" width="200" height="50" rx="6" class="box"/>
  <text x="200.0" y="171.0" text-anchor="middle" class="label">nginx</text>
  <text x="200.0" y="189.0" text-anchor="middle" class="small">the application</text>
  <rect x="100" y="220" width="200" height="50" rx="6" class="box-muted"/>
  <text x="200.0" y="241.0" text-anchor="middle" class="label">no shell</text>
  <text x="200.0" y="259.0" text-anchor="middle" class="small">no curl, no ps, no jq</text>
  <rect x="100" y="290" width="200" height="50" rx="6" class="box"/>
  <text x="200.0" y="311.0" text-anchor="middle" class="label">PID + net namespace</text>
  <text x="200.0" y="329.0" text-anchor="middle" class="small">shared</text>
  <rect x="460" y="80" width="280" height="280" rx="10" class="box"/>
  <text x="600" y="105" class="label" text-anchor="middle">ubi9/toolbox sidecar</text>
  <text x="600" y="125" class="small" text-anchor="middle">(transient debug container)</text>
  <rect x="500" y="150" width="200" height="50" rx="6" class="box"/>
  <text x="600.0" y="171.0" text-anchor="middle" class="label">bash + diagnostics</text>
  <text x="600.0" y="189.0" text-anchor="middle" class="small">curl, ps, ss, strace</text>
  <rect x="500" y="220" width="200" height="50" rx="6" class="box"/>
  <text x="600.0" y="241.0" text-anchor="middle" class="label">--pid=container:N</text>
  <text x="600.0" y="259.0" text-anchor="middle" class="small">sees target's processes</text>
  <rect x="500" y="290" width="200" height="50" rx="6" class="box"/>
  <text x="600.0" y="311.0" text-anchor="middle" class="label">--network=container:N</text>
  <text x="600.0" y="329.0" text-anchor="middle" class="small">sees target's ports</text>
  <line x1="340" y1="220" x2="460" y2="220" class="conn-red" marker-end="url(#arrow-red)"/>
  <line x1="340" y1="290" x2="460" y2="290" class="conn-red" marker-end="url(#arrow-red)"/>
  <text x="400.0" y="215" class="small" text-anchor="middle">shared</text>
  <text x="400.0" y="285" class="small" text-anchor="middle">shared</text>
  <text x="400.0" y="405" class="small" text-anchor="middle">Debugging sees the target's processes and ports without modifying it</text>
</svg>
